<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话导出增强器</title>
<link rel="stylesheet" href="panel.css">
</head>
<body class="collapsed">
  <button id="bubble" class="bubble" type="button" title="点击导出，拖动可调整位置（Alt+Shift+E）" aria-label="打开导出面板，可拖动位置">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5v9.5"></path>
      <path d="m8.5 9.5 3.5 3.5 3.5-3.5"></path>
      <path d="M4.5 15.5v2.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-2.5"></path>
    </svg>
    <span id="bubbleBadge" class="bubble-badge" hidden>0</span>
  </button>

  <section id="panel" class="panel" hidden aria-label="会话导出面板">
    <header class="head">
      <div class="head-main">
        <div class="title-row">
          <h1>会话导出</h1>
          <span id="siteTag" class="tag">连接中</span>
        </div>
        <p id="docTitle" class="doc-title">正在读取页面…</p>
      </div>
      <div class="head-actions">
        <button id="btnRescan" class="icon-btn" type="button" title="重新扫描页面">⟳</button>
        <button id="btnSettings" class="icon-btn" type="button" title="设置">⚙</button>
        <button id="btnCollapse" class="icon-btn" type="button" title="收起（Esc）">✕</button>
      </div>
    </header>

    <div class="scope" id="scope" role="tablist" aria-label="导出范围">
      <button class="seg is-active" data-scope="all" role="tab" aria-selected="true" type="button">整段会话</button>
      <button class="seg" data-scope="selected" role="tab" aria-selected="false" type="button">选中的消息</button>
    </div>

    <div class="tools">
      <button class="chip" data-act="all" type="button">全选</button>
      <button class="chip" data-act="none" type="button">清空</button>
      <button class="chip" data-act="invert" type="button">反选</button>
      <button class="chip" data-act="user" type="button">仅提问</button>
      <button class="chip" data-act="assistant" type="button">仅回答</button>
      <button class="chip ghost" data-act="load" type="button" title="向上滚动加载更早的消息">加载更早</button>
    </div>

    <ul id="list" class="list" aria-label="消息列表"></ul>

    <div class="statusbar">
      <span id="status">正在读取…</span>
      <span class="status-right">
        <span id="source" class="engine" hidden></span>
        <span id="engine" class="engine" hidden></span>
        <span id="sizeHint" class="muted"></span>
      </span>
    </div>

    <div class="formats" id="formats" role="tablist" aria-label="导出格式">
      <button class="fmt is-active" data-format="html" type="button">HTML<em>可交互</em></button>
      <button class="fmt" data-format="markdown" type="button">Markdown</button>
      <button class="fmt" data-format="json" type="button">JSON</button>
      <button class="fmt" data-format="text" type="button">纯文本</button>
    </div>

    <footer class="foot">
      <label class="foot-field">
        <span>导出标题／文件名</span>
        <input id="exportTitle" class="file-input" type="text" spellcheck="false" maxlength="200" placeholder="自动使用会话标题">
      </label>
      <div class="foot-row">
        <div class="foot-actions">
          <button id="btnCopy" class="btn ghost" type="button">复制</button>
          <button id="btnExport" class="btn primary" type="button">导出</button>
        </div>
        <label class="split-option"><input id="splitTurns" type="checkbox">按问答拆分</label>
      </div>
    </footer>

    <section id="splitPicker" class="split-picker" hidden aria-label="选择拆分问答">
      <div class="split-card">
        <h2>选择要导出的问答</h2>
        <p id="splitHint">每组单独保存，可修改各自的标题／文件名。</p>
        <div id="splitList" class="split-list"></div>
        <div class="split-actions">
          <button id="splitAll" class="btn ghost" type="button">全选</button>
          <button id="splitNone" class="btn ghost" type="button">清空</button>
          <button id="splitCancel" class="btn ghost" type="button">取消</button>
          <button id="splitConfirm" class="btn primary" type="button">导出选中</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" hidden></div>
  </section>

  <script src="../shared/defaults.js"></script>
  <script src="panel.js"></script>
</body>
</html>
